spring:
  application:
    name: jpa
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gift_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci}"
    username: ${SPRING_DATASOURCE_USERNAME:gift_order}
    password: ${SPRING_DATASOURCE_PASSWORD:gift_order}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:google-genai}
    google:
      genai:
        api-key: ${AI_GOOGLE_GENAI_APIKEY}
        chat:
          model: gemini-3.5-flash-lite

