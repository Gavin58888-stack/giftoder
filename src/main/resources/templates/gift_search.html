<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>搜尋紀錄｜萬能秘書</title><link rel="stylesheet" th:href="@{/css/gifts.css}"></head>
<body><div class="app-shell">
    <aside class="sidebar"><a class="brand" th:href="@{/gifts}"><span class="brand-mark">g.</span><span>您的秘書已上線<small>GIFT DESK</small></span></a><div class="side-label">工作台</div><nav class="side-nav"><a class="nav-link" th:href="@{/gifts}"><span class="nav-icon">▦</span>送禮名冊</a><a class="nav-link" th:href="@{/vips}"><span class="nav-icon">♙</span>貴賓名冊</a><a class="nav-link" th:href="@{/vips/cold-palace}"><span class="nav-icon">▣</span>冷宮名單</a><a class="nav-link" th:href="@{/gifts/summary}"><span class="nav-icon">▤</span>統計報表</a><a class="nav-link" th:href="@{/gifts/secretary-report}"><span class="nav-icon">✧</span>貼心提醒</a><a class="nav-link active" th:href="@{/gifts/search}"><span class="nav-icon">⌕</span>搜尋紀錄</a></nav><div class="sidebar-note"><span class="note-icon">✦</span><strong>貴賓的支持與鼓勵，是我們進步的原動力</strong></div></aside>
    <main class="main-content"><header class="topbar"><div class="breadcrumb">工作台 <span>/</span> 搜尋紀錄</div><div class="topbar-right"><span class="avatar">禮</span></div></header>
        <section class="page-content"><div class="page-heading"><div><div class="eyebrow">GIFT RECORDS</div><h1>搜尋送禮紀錄</h1><p class="page-subtitle">快速查找貴賓聯絡方式、送禮品項與配送資訊。</p></div><a class="button button-secondary" th:href="@{/gifts}"><span>←</span> 返回送禮名冊</a></div>
            <section class="panel search-panel"><div class="search-intro"><div class="search-illustration">⌕</div><div><h2>想找哪一筆紀錄？</h2><p>輸入貴賓姓名、公司、電話、地址或禮品品項。</p></div></div><form class="large-search-form" th:action="@{/gifts/search}" method="get"><span>⌕</span><input type="search" name="q" th:value="${query}" placeholder="例如：張總經理、宅配、蘋果禮盒" autofocus><button class="button button-primary" type="submit">搜尋紀錄 <span>→</span></button></form>
                <div class="search-result-heading" th:if="${query != null and !#strings.isEmpty(query)}"><div><h2>搜尋結果</h2><p>關鍵字「<strong th:text="${query}"></strong>」</p></div><span class="result-count"><strong th:text="${#lists.size(results)}">0</strong> 筆紀錄</span></div>
                <div class="table-scroll" th:if="${!#lists.isEmpty(results)}"><table class="data-table"><thead><tr><th>貴賓 ID</th><th>貴賓</th><th>禮品項目</th><th>數量</th><th>電話</th><th>手機</th><th>配送地址</th><th>配送方式</th></tr></thead><tbody><tr th:each="gift : ${results}"><td class="vip-id" th:text="${gift.vipId}"></td><td><div class="vip-name" th:text="${gift.vipName}"></div><div class="vip-title" th:text="${gift.vipTitle}"></div></td><td><span class="gift-pill" th:text="${gift.giftItem}"></span></td><td><strong th:text="${gift.quantity}"></strong> 份</td><td th:text="${gift.phone}"></td><td th:text="${gift.mobile}"></td><td class="address-result" th:text="${gift.address}"></td><td><span class="delivery-tag" th:text="${gift.deliveryMethod}"></span></td></tr></tbody></table></div>
                <div class="empty-state search-empty" th:if="${#lists.isEmpty(results)}"><span>⌕</span><strong th:text="${query != null and !#strings.isEmpty(query) ? '找不到符合的紀錄' : '從關鍵字開始搜尋'}">從關鍵字開始搜尋</strong><small th:text="${query != null and !#strings.isEmpty(query) ? '試試其他姓名、電話或禮品名稱。' : '搜尋貴賓、聯絡資料或禮品品項。'}">搜尋貴賓、聯絡資料或禮品品項。</small></div>
            </section><footer class="page-footer">用心安排每一份祝福</footer></section>
    </main>
</div></body></html>
